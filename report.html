<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FindMyPath - Report Issue</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f2ef;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      color: #6d5e53;
    }

    .search-container {
      display: flex;
      align-items: center;
      background-color: #c3a793;
      border-radius: 25px;
      padding: 8px 15px;
      flex: 1;
      margin: 10px;
    }

    .search-icon {
      color: #6d5e53;
      margin-right: 5px;
    }

    .search-input {
      border: none;
      background: transparent;
      flex: 1;
      padding: 5px;
      color: #6d5e53;
      outline: none;
    }

    .search-input::placeholder {
      color: #8a7968;
    }

    .search-button {
      background: none;
      border: none;
      color: #6d5e53;
      cursor: pointer;
    }

    .points {
      display: flex;
      align-items: center;
      color: #ff9800;
      font-weight: bold;
    }

    .flame-icon {
      margin-right: 5px;
    }

    .profile-button {
      width: 40px;
      height: 40px;
      background-color: #c3a793;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #6d5e53;
    }

    .map-section {
      flex-grow: 1;
      background: linear-gradient(to bottom, #e8e5e2, #e1d4c8);
      border-radius: 25px;
      margin: 20px 0;
      padding: 20px;
      position: relative;
    }

    #map {
      width: 100%;
      height: 400px;
      border-radius: 20px;
      z-index: 1;
      margin-bottom: 20px;
    }

    .current-location {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background-color: #c3a793;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .map-info h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .map-info p {
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .form-section {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 16px;
      margin-bottom: 10px;
      color: #333;
    }

    .file-upload {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .upload-button {
      padding: 10px 20px;
      background-color: #c3a793;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .description-textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background-color: #e0e0e6;
      resize: none;
      font-size: 14px;
      outline: none;
    }

    .status-options {
      display: flex;
      gap: 20px;
    }

    .status-option {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .status-radio {
      display: none;
    }

    .status-indicator {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .critical {
      background-color: #ff5252;
    }

    .moderate {
      background-color: #ffcc00;
    }

    .publish-button {
      display: block;
      width: 100%;
      max-width: 300px;
      padding: 15px;
      background-color: #c3a793;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 0 auto;
    }

    .publish-button:hover {
      background-color: #b39683;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">FindMyPath</div>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" placeholder="Enter Location" />
      <button class="search-button">⌕</button>
    </div>
    <div class="points">
      <span class="flame-icon">🔥</span>
      <span>40</span>
    </div>
    <div class="profile-button">
      <span>👤</span>
    </div>
  </div>

  <main class="map-section">
    <div id="map"></div>
    <div class="current-location" id="locationButton" title="Get Current Location">📍</div>
    <div class="map-info">
      <h1>MAP</h1>
      <p>Pothole/Issue Pinpointing: Tap the map to mark location, drag marker if needed.</p>
      <p>Visual Heatmap: High-frequency issue zones appear color-coded.</p>
    </div>
  </main>

  <div class="form-section">
    <label class="form-label">Upload Image</label>
    <div class="file-upload">
      <label for="chooseFileBtn" class="upload-button" id="uploadImageBtn">Choose File</label>
      <input type="file" id="chooseFileBtn" style="display: none;" />
    </div>
  </div>

  <div class="form-section">
    <label class="form-label">Description</label>
    <textarea class="description-textarea" placeholder="Enter description..."></textarea>
  </div>

  <div class="form-section">
    <label class="form-label">Status</label>
    <div class="status-options">
      <label class="status-option">
        <input type="radio" name="status" class="status-radio" value="critical" checked />
        <span class="status-indicator critical"></span>
        <span>Critical</span>
      </label>
      <label class="status-option">
        <input type="radio" name="status" class="status-radio" value="moderate" />
        <span class="status-indicator moderate"></span>
        <span>Moderate</span>
      </label>
    </div>
  </div>

  <button class="publish-button" id="publishBtn">Publish Report</button>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

  <script>
    const map = L.map('map').setView([28.6139, 77.2090], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker;

    map.on('click', function (e) {
      if (marker) {
        marker.setLatLng(e.latlng);
      } else {
        marker = L.marker(e.latlng, { draggable: true }).addTo(map);
      }
    });

    const heatData = [
      [28.6139, 77.2090, 0.7],
      [28.6200, 77.2100, 0.9],
      [28.6170, 77.2200, 0.8],
      [28.6120, 77.2000, 0.6],
    ];

    L.heatLayer(heatData, {
      radius: 25,
      blur: 15,
      gradient: {
        0.4: 'blue',
        0.6: 'lime',
        0.8: 'orange',
        1.0: 'red',
      },
    }).addTo(map);

    const locationButton = document.getElementById('locationButton');
    locationButton.addEventListener('click', function () {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          map.setView([lat, lng], 15);
          if (marker) {
            marker.setLatLng([lat, lng]);
          } else {
            marker = L.marker([lat, lng], { draggable: true }).addTo(map);
          }
        }, function () {
          alert('Unable to retrieve your location.');
        });
      } else {
        alert('Geolocation is not supported by your browser.');
      }
    });

    const uploadImageBtn = document.getElementById('uploadImageBtn');
    const chooseFileBtn = document.getElementById('chooseFileBtn');

    uploadImageBtn.addEventListener('click', () => {
      chooseFileBtn.click();
    });

    chooseFileBtn.addEventListener('change', () => {
      if (chooseFileBtn.files.length > 0) {
        uploadImageBtn.textContent = chooseFileBtn.files[0].name;
      }
    });

    const publishBtn = document.getElementById('publishBtn');
    publishBtn.addEventListener('click', function () {
      const description = document.querySelector('.description-textarea').value.trim();
      const status = document.querySelector('input[name="status"]:checked').value;

      if (!description) {
        alert('Please enter a description.');
        return;
      }

      alert(`Report submitted!\nStatus: ${status}\nDescription: ${description}`);
      // Backend submission logic goes here
    });
  </script>
</body>

</html>
