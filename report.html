<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindMyPath - Report Issue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            
        }

        body {
            background-color: #f5f2ef;
            height: 100vh;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #6d5e53;
        }

        .search-container {
            display: flex;
            align-items: center;
            background-color: #c3a793;
            border-radius: 25px;
            padding: 8px 15px;
            flex: 1;
            margin: 0 20px;
        }

        .search-icon {
            color: #6d5e53;
            margin-right: 5px;
        }

        .search-input {
            border: none;
            background: transparent;
            flex: 1;
            padding: 5px;
            color: #6d5e53;
            outline: none;
        }

        .search-input::placeholder {
            color: #8a7968;
        }

        .search-button {
            background: none;
            border: none;
            color: #6d5e53;
            cursor: pointer;
        }

        .points {
            display: flex;
            align-items: center;
            color: #ff9800;
            font-weight: bold;
        }

        .flame-icon {
            margin-right: 5px;
        }

        .profile-button {
            width: 40px;
            height: 40px;
            background-color: #c3a793;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #6d5e53;
        }

        .map-container {
            background-color: #d0d0d0;
            border-radius: 15px;
            height: 200px;
            margin-bottom: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .map-container h2 {
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        .map-container p {
            font-size: 12px;
            text-align: center;
            max-width: 80%;
            margin-bottom: 8px;
        }

        .current-location {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: #c3a793;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .form-section {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }

        .file-upload {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .upload-button {
            padding: 10px 20px;
            background: transparent;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }
/* 
        .upload-button.active {
            background-color: #c3a793;
            color: white;
        } */

        .description-textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background-color: #e0e0e6;
            resize: none;
            font-size: 14px;
            outline: none;
        }

        .status-options {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .status-radio {
            display: none;
        }

        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .critical {
            background-color: #ff5252;
        }

        .moderate {
            background-color: #ffcc00;
        }

        .publish-button {
            display: block;
            width: 100%;
            max-width: 300px;
            padding: 15px;
            background-color: #c3a793;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 auto;
            text-align: center;
        }

        .publish-button:hover {
            background-color: #b39683;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">FindMyPath</div>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="Enter Location">
            <button class="search-button">⌕</button>
        </div>
        <div class="points">
            <span class="flame-icon">🔥</span>
            <span>40</span>
        </div>
        <div class="profile-button">
            <span>👤</span>
        </div>
    </div>

    <div class="map-container">
        <h2>MAP</h2>
        <p>Permissionless Pinpointing: Map integration (Google Maps/OSM) with drag-and-drop or tap-to-mark location</p>
        <p>Visual Heatmap: Highlight high-frequency issue zones with color-coded severity</p>
        <div class="current-location" id="locationButton"></div>
    </div>

    <div class="form-section">
        <div class="file-upload">
            <p class="upload-button active" id="uploadImageBtn">Upload Image</p>
            <input type="file" class="upload-button" id="chooseFileBtn">
        </div>
    </div>

    <div class="form-section">
        <label class="form-label">Description</label>
        <textarea class="description-textarea" placeholder="Enter description..."></textarea>
    </div>

    <div class="form-section">
        <label class="form-label">Status</label>
        <div class="status-options">
            <label class="status-option">
                <input type="radio" name="status" class="status-radio" value="critical" checked>
                <span class="status-indicator critical"></span>
                <span>Critical</span>
            </label>
            <label class="status-option">
                <input type="radio" name="status" class="status-radio" value="moderate">
                <span class="status-indicator moderate"></span>
                <span>Moderate</span>
            </label>
        </div>
    </div>

    <button class="publish-button" id="publishBtn">Publish Report</button>

    <script>
        // Toggle between upload buttons
        const uploadImageBtn = document.getElementById('uploadImageBtn');
        const chooseFileBtn = document.getElementById('chooseFileBtn');

        uploadImageBtn.addEventListener('click', function () {
            uploadImageBtn.classList.add('active');
            chooseFileBtn.classList.remove('active');
        });

        chooseFileBtn.addEventListener('click', function () {
            chooseFileBtn.classList.add('active');
            uploadImageBtn.classList.remove('active');
        });

        // Simulated location functionality
        const locationButton = document.getElementById('locationButton');
        locationButton.addEventListener('click', function () {
            alert('Getting current location...');
            // In a real app, this would use the Geolocation API
        });

        // Form submission
        const publishBtn = document.getElementById('publishBtn');
        publishBtn.addEventListener('click', function () {
            const description = document.querySelector('.description-textarea').value;
            const status = document.querySelector('input[name="status"]:checked').value;

            if (!description) {
                alert('Please enter a description');
                return;
            }

            alert(`Report submitted with status: ${status}`);
            // In a real app, this would send data to a server
        });
    </script>
</body>

</html>
