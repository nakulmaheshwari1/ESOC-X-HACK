<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixMyPath</title>

    <!-- CSS -->
    <link rel="stylesheet" href="index.css" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
    <div class="container">
        <!-- Navbar -->
        <header class="navbar">
            <div class="logo">FixMyPath</div>

            <div class="search-report">
                <div class="search-box">
                    <button class="menu-btn">☰</button>
                    <input type="text" placeholder="Search..." />
                    <button class="search-btn">🔍</button>
                </div>
                <button class="report-btn">
                    <span class="toggle-switch"></span>
                    Report Now
                </button>

                <div class="flame-count">🔥 40</div>
            </div>

            <div class="profile-circle"></div>
            <div class="vertical-text">Do</div>
        </header>
        <!-- Map Section -->
        <main class="map-section">
            <div id="map"></div>
            <div class="map-info">
                <h1>MAP</h1>
                <p>
                    Pothole/Issue Pinpointing: Map integration (OpenStreetMap via Leaflet) with drag-and-drop or
                    tap-to-mark location.
                </p>
                <p>
                    Visual Heatmap: Highlight high-frequency issue zones with color-coded severity.
                </p>
            </div>
        </main>
